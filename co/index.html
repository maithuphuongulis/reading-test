<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi lớp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>

:root {
  --paper: #f5f6f9;
  --surface: #ffffff;
  --ink: #1a2230;
  --muted: #5a6577;
  --line: #dce1e9;
  --accent: #23439e;
  --accent-ink: #ffffff;
  --accent-soft: #e8edfa;
  --hl: #ffe45c;
  --hl-ink: #1a2230;
  --hl-soft: #fff6c4;
  --ok: #1d7347;
  --ok-soft: #e1f2e8;
  --bad: #b1352c;
  --bad-soft: #fbe6e4;
  --warn: #8a5a00;
  --warn-soft: #fdf0d2;
  --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --bar-h: 60px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #11151c; --surface: #1a1f29; --ink: #e5e9f0; --muted: #9ba5b6; --line: #2c3340;
    --accent: #93abff; --accent-ink: #10162a; --accent-soft: #1f2a46;
    --hl: #6a5a0c; --hl-ink: #fff4b8; --hl-soft: #3a3210;
    --ok: #6cc996; --ok-soft: #173126; --bad: #ff8f85; --bad-soft: #3a1d1b; --warn: #f2c46b; --warn-soft: #3a2e12;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 16px; line-height: 1.55; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; }
button:disabled { cursor: default; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
h1, h2, h3 { margin: 0; line-height: 1.3; text-wrap: balance; }
p { margin: 0; }

/* Thanh trên cùng */
.bar { position: sticky; top: 0; z-index: 10; background: var(--surface); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; min-height: var(--bar-h); }
.brand { display: flex; flex-direction: column; min-width: 0; flex: 1 1 200px; }
.brand b { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--surface); font-size: 13px; font-weight: 600; color: var(--muted); display: grid; place-items: center; padding: 0; font-variant-numeric: tabular-nums; }
.dot.ok { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.dot.fixed { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.dot.bad { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.dot.retry { border-color: var(--bad); color: var(--bad); }
.dot.answered { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.dot.skip { border-style: dashed; }
.dot.now { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--accent); }

.btn { border: none; border-radius: 10px; padding: 12px 20px; font-weight: 600; font-size: 16px; min-height: 48px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.primary:disabled { opacity: 0.45; }
.btn.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); }
.btn.small { padding: 8px 14px; min-height: 40px; font-size: 14px; }
.link { background: none; border: none; padding: 6px 0; color: var(--accent); font-weight: 600; font-size: 15px; text-decoration: underline; text-underline-offset: 3px; }

/* Màn hình chính giữa (mở bài, lỗi, báo cáo) */
.center { max-width: 560px; margin: 0 auto; padding: 32px 16px 64px; display: flex; flex-direction: column; gap: 20px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px 20px; display: flex; flex-direction: column; gap: 16px; }
.eyebrow { font-size: 12.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.title { font-family: var(--font-read); font-size: 26px; font-weight: 600; }
.meta { display: flex; flex-direction: column; gap: 4px; font-size: 15px; color: var(--muted); }
.meta b { color: var(--ink); font-weight: 600; }
label.f { display: flex; flex-direction: column; gap: 6px; font-weight: 600; font-size: 15px; }
select, input[type=text], input[type=tel] { font: inherit; font-size: 16px; padding: 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); width: 100%; }
.err { color: var(--bad); font-size: 15px; }
.spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* Làm bài */
.tabs { display: none; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); height: calc(100vh - var(--bar-top, var(--bar-h))); height: calc(100dvh - var(--bar-top, var(--bar-h))); }
.pane { overflow-y: auto; padding: 24px 28px 48px; min-width: 0; }
.pane.passage { background: var(--surface); border-right: 1px solid var(--line); }
.passage-text { font-family: var(--font-read); font-size: 17.5px; line-height: 1.8; max-width: 64ch; display: flex; flex-direction: column; gap: 14px; }
.passage-text p { border-radius: 6px; transition: background-color 0.3s; }
.passage-text p.para-hl { background: var(--hl-soft); box-shadow: 0 0 0 6px var(--hl-soft); }
mark { background: var(--hl); color: var(--hl-ink); border-radius: 3px; padding: 1px 2px; }
.pane-label { font-size: 12.5px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 14px; }
.back { position: sticky; bottom: 12px; margin-top: 24px; box-shadow: 0 4px 14px rgba(0,0,0,0.18); }

.question { display: flex; flex-direction: column; gap: 16px; max-width: 640px; }
.qtext { font-size: 18px; font-weight: 600; }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: grid; grid-template-columns: 34px 1fr; gap: 10px; align-items: start; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; min-height: 52px; }
.opt .ol { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: 14px; }
.opt .ot { padding-top: 3px; }
.opt .tagline { grid-column: 2; font-size: 13px; font-weight: 600; }
.opt:not(:disabled):hover { border-color: var(--accent); }
.opt.is-sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-sel .ol { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.opt.is-wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.is-wrong .ol { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.opt.is-wrong .tagline { color: var(--bad); }
.opt.is-right { border-color: var(--ok); background: var(--ok-soft); }
.opt.is-right .ol { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.opt.is-right .tagline { color: var(--ok); }
.opt.is-picked { border-color: var(--accent); background: var(--accent-soft); }
.opt.is-picked .tagline { color: var(--accent); }
.opt:disabled:not(.is-wrong):not(.is-right):not(.is-picked) { opacity: 0.6; }

.fb { border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; font-size: 15.5px; }
.fb.bad { background: var(--bad-soft); }
.fb.ok { background: var(--ok-soft); }
.fb.neutral { background: var(--accent-soft); }
.fb .head { font-weight: 700; }
.fb .why { display: flex; flex-direction: column; gap: 2px; }
.fb .why b { font-size: 14px; }
.chip { display: inline-block; font-size: 12.5px; font-weight: 600; padding: 2px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); }
.qnav { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding-top: 8px; border-top: 1px solid var(--line); }
.confirm { background: var(--warn-soft); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

@media (max-width: 859px) {
  .tabs { display: grid; grid-template-columns: 1fr 1fr; position: sticky; top: var(--bar-top, var(--bar-h)); z-index: 9; background: var(--paper); padding: 8px 16px; gap: 6px; }
  .tabs button { border: 1.5px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px; font-weight: 600; font-size: 15px; }
  .tabs button[aria-selected=true] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .split { display: block; height: auto; }
  .pane { overflow: visible; padding: 16px 16px 40px; }
  .pane.passage { border-right: none; background: var(--paper); }
  #vQuiz[data-tab=question] .pane.passage { display: none; }
  #vQuiz[data-tab=passage] .pane.qpane { display: none; }
  .passage-text { font-size: 17px; }
  .dots { order: 3; width: 100%; }
}

/* Báo cáo */
.score { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.score .big { font-family: var(--font-read); font-size: 48px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.items { display: flex; flex-direction: column; gap: 0; border: 1px solid var(--line); border-radius: 12px; }
.item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 14px; border-top: 1px solid var(--line); font-size: 15px; }
.item:first-child { border-top: none; }
.st-first { color: var(--ok); font-weight: 600; }
.st-fixed { color: var(--warn); font-weight: 600; }
.st-wrong, .st-skip { color: var(--bad); font-weight: 600; }
.types { display: flex; flex-direction: column; gap: 10px; }
.type { background: var(--paper); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; }
.type .tip { font-size: 15px; }
.note { font-size: 14px; color: var(--muted); }

.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 10px; font-size: 15px; max-width: calc(100% - 32px); z-index: 50; box-shadow: 0 6px 20px rgba(0,0,0,0.25); }

/* Giai đoạn 2: nhóm câu, các dạng câu */
.dot { width: auto; min-width: 32px; padding: 0 7px; border-radius: 16px; }
.groupbox { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-size: 14.5px; display: flex; flex-direction: column; gap: 4px; color: var(--muted); }
.groupbox b { color: var(--ink); font-size: 13px; letter-spacing: 0.04em; }
.qtext { display: flex; flex-direction: column; gap: 8px; }
.kw { align-self: flex-start; font-weight: 700; letter-spacing: 0.08em; border: 1.5px solid var(--ink); padding: 2px 12px; border-radius: 6px; font-size: 15px; }
.blank { display: inline-block; min-width: 6ch; border-bottom: 2px solid var(--muted); }
.opts.compact { flex-direction: row; flex-wrap: wrap; }
.opts.compact .opt { grid-template-columns: 1fr; justify-items: center; text-align: center; min-width: 64px; padding: 10px 12px; }
.opts.compact .opt .tagline { grid-column: 1; }
.opt .ol.wide { width: auto; padding: 0 12px; border-radius: 999px; }
.note-sel { font-size: 14px; color: var(--muted); font-weight: 600; }
.txtwrap { display: flex; flex-direction: column; gap: 6px; }
.txtwrap input { font-size: 17px; padding: 14px; }
.txtwrap input:disabled { opacity: 0.8; }
.count { font-size: 13.5px; color: var(--muted); }
.count.over { color: var(--bad); font-weight: 600; }
.prev { font-size: 14.5px; color: var(--bad); }
.prev s { text-decoration-thickness: 2px; }
.fb .ans { font-size: 15px; }
.portal { max-width: 880px; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); gap: 16px; }
.card, .card > *, .row > * { min-width: 0; overflow-wrap: anywhere; }
.chart { width: 100%; height: auto; display: block; color: var(--muted); }
.chart text { fill: currentColor; font: 12px var(--font-ui); }
.overdue { color: var(--bad); }

.dashboard { max-width: 1160px; padding: 24px 16px 64px; margin: auto; display: grid; gap: 22px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; }
.stat b { display: block; font: 600 32px var(--font-read); }
.stat { padding: 16px; background: var(--accent-soft); border-radius: 12px; }
.table-scroll { overflow-x: auto; max-width: 100%; isolation: isolate; }
table { border-collapse: separate; border-spacing: 0; width: 100%; font-size: 14px; }
th, td { padding: 12px; border-bottom: 1px solid var(--line); text-align: center; min-width: 120px; }
thead th { background: var(--surface); vertical-align: top; }
th:first-child { position: sticky; left: 0; z-index: 1; background: var(--surface); text-align: left; min-width: 145px; max-width: 200px; box-shadow: 2px 0 var(--line); }
td.high { background: var(--ok); color: var(--surface); font-weight: 700; }
td.good { background: var(--ok-soft); color: var(--ok); }
td.mid { background: var(--warn-soft); color: var(--warn); }
td.low { background: var(--bad-soft); color: var(--bad); }
td.empty { background: var(--paper); color: var(--muted); }
td.doing { outline: 2px dotted var(--accent); outline-offset: -4px; }
.error-bar { height: 12px; background: var(--paper); border-radius: 8px; overflow: hidden; }
.error-bar span { display: block; background: var(--bad); height: 100%; }
.section-list { display: grid; gap: 16px; }
.section-list > article { padding-bottom: 14px; border-bottom: 1px solid var(--line); }
.class-link { width: 100%; font-size: 14px; }
.dashboard > *, .stats > *, .cards > * { min-width: 0; }
a { color: var(--accent); overflow-wrap: anywhere; }
input[type=password], textarea { font: inherit; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); }
textarea { min-height: 100px; }
.chart-key { display: flex; flex-wrap: wrap; gap: 16px; font-size: 14px; }
.chart-key span { color: var(--accent); }
.chart-key span:last-child { color: var(--ok); }
</style>

</head>
<body>
<header class="bar"><div class="brand"><b>Theo dõi lớp</b><span id="updated"></span></div><button id="classesBtn" class="btn ghost small" hidden>Chọn lớp</button><button id="reloadBtn" class="btn ghost small" hidden>Tải lại</button><button id="logoutBtn" class="link" hidden>Đăng xuất</button></header>
<main>
<section class="center" id="login"><form class="card" id="loginForm"><h1 class="title">Theo dõi lớp</h1><label class="f" for="passcode">Mật khẩu của cô<input id="passcode" type="password" inputmode="numeric" pattern="[0-9]*" autocomplete="current-password" required></label><button class="btn primary" id="loginBtn">Vào</button></form></section>
<div class="dashboard"><p id="message" role="status" hidden></p><div id="content" hidden></div><section class="card" id="studentDetail" hidden tabindex="-1"></section><section class="card" id="copyFallback" hidden><label class="f" for="copyText">Chữ đã được chọn. Cô nhấn giữ hoặc Ctrl+C để copy.<textarea id="copyText" readonly></textarea></label><button class="btn ghost small" id="closeCopy">Đóng</button></section></div>
</main>
<script>window.API_URL = "https://script.google.com/macros/s/AKfycbwGLJXlBk0FaNWnOvMJJb15OBDoogiy-oAz_j0PCJuHsPMT45JL4sw8Wc60dhn7-UPW/exec";</script>
<script>
var D = { pass: '', cls: '', data: null, busy: false, version: 0 };
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function remember(key, value) { try { if (value) localStorage.setItem(key, value); else localStorage.removeItem(key); } catch (e) {} }
function recalled(key) { try { return localStorage.getItem(key) || ''; } catch (e) { return ''; } }
function pct(v) { return v == null ? '—' : Math.round(v * 100) + '%'; }
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    var tries = 0;
    function success(res) { if (res && res.error) { var e = new Error(res.error); e.user = true; reject(e); } else resolve(res); }
    function failure(e) { tries++; if (tries < 3) setTimeout(go, 1200 * tries); else reject(e); }
    function go() {
      fetch(window.API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args }), credentials: 'omit', redirect: 'follow' }).then(function (r) { return r.json(); }).then(success, failure);
    }
    go();
  });
}
function msgOf(e) { return e && e.user ? e.message : 'Chưa kết nối được. Cô kiểm tra mạng rồi bấm Tải lại hoặc Vào.'; }
function message(s) { $('message').textContent = s; $('message').hidden = !s; }
function busy(on) { D.busy = on; ['loginBtn', 'reloadBtn', 'classesBtn'].forEach(function (id) { $(id).disabled = on; }); }
function fetchClass(cls, restoring) {
  if (D.busy) return;
  busy(true); message('Đang tải dữ liệu…');
  var version = D.version;
  return call('apiDashboard', D.pass, cls).then(function (data) {
    if (version !== D.version) return;
    D.cls = data.cls || ''; D.data = data;
    remember('reading-teacher-pass', D.pass); if (D.cls) remember('reading-teacher-class', D.cls);
    $('login').hidden = true; $('content').hidden = false; $('studentDetail').hidden = true;
    ['classesBtn', 'reloadBtn', 'logoutBtn'].forEach(function (id) { $(id).hidden = false; });
    $('updated').textContent = 'Cập nhật lúc ' + new Date().toLocaleString('vi-VN');
    message(''); render(data);
  }, function (e) {
    if (version !== D.version) return;
    if (e.user && e.message === 'Sai mật khẩu.') { logout(); message(msgOf(e)); }
    else if (restoring && e.user) { remember('reading-teacher-class', ''); busy(false); return fetchClass(''); }
    else message(msgOf(e));
  }).then(function () { if (version === D.version) busy(false); });
}
function logout() {
  D.version++; D.pass = ''; D.cls = ''; D.data = null; busy(false);
  remember('reading-teacher-pass', ''); remember('reading-teacher-class', '');
  $('passcode').value = ''; $('login').hidden = false; $('content').hidden = true; $('content').innerHTML = '';
  $('studentDetail').hidden = true; $('studentDetail').innerHTML = ''; $('copyFallback').hidden = true; $('copyText').value = '';
  ['classesBtn', 'reloadBtn', 'logoutBtn'].forEach(function (id) { $(id).hidden = true; }); $('updated').textContent = ''; message('');
}
function chart(tests, firstKey, finalKey) {
  if (!tests.some(function (t) { return t[firstKey] != null; })) return '<p class="note">Chưa có điểm vòng 1 để vẽ biểu đồ.</p>';
  var h = '<svg class="chart" viewBox="0 0 680 240" role="img" aria-label="Điểm qua các bài, trục từ 0 đến 100 phần trăm">';
  [0, 25, 50, 75, 100].forEach(function (v) { var y = 180 - v * 1.6; h += '<path d="M48 ' + y + 'H650" stroke="var(--line)"/><text x="42" y="' + (y + 4) + '" text-anchor="end">' + v + '%</text>'; });
  function x(i) { return tests.length === 1 ? 350 : 80 + i * 530 / (tests.length - 1); }
  [firstKey, finalKey].forEach(function (key, n) {
    if (!key) return;
    var path = '', previous = false, color = n ? 'var(--ok)' : 'var(--accent)';
    tests.forEach(function (t, i) {
      if (t[key] == null) { previous = false; return; }
      var y = 180 - Math.max(0, Math.min(1, t[key])) * 160;
      path += (previous ? 'L' : 'M') + x(i) + ',' + y; previous = true;
      h += '<circle cx="' + x(i) + '" cy="' + y + '" r="4" fill="' + color + '"><title>' + esc(t.title) + (n ? ' · Sau sửa: ' : ' · Vòng 1: ') + pct(t[key]) + '</title></circle>';
    });
    h += '<path d="' + path + '" fill="none" stroke="' + color + '" stroke-width="3"' + (n ? ' stroke-dasharray="7 5"' : '') + '/>';
  });
  tests.forEach(function (t, i) { if (i % Math.max(1, Math.ceil(tests.length / 5)) === 0 || i === tests.length - 1) h += '<text x="' + x(i) + '" y="207" text-anchor="middle">' + esc(t.title.slice(0, 13)) + (t.title.length > 13 ? '…' : '') + '</text>'; });
  return h + '</svg><div class="chart-key"><span>━ Vòng 1</span><span>┄ Sau vòng sửa (các em đã sửa)</span></div>';
}
function section(title, body) { return '<section class="card"><h2>' + esc(title) + '</h2>' + body + '</section>'; }
function scoreClass(c) { return c.pct == null ? 'empty' + (c.status === 'dang' ? ' doing' : '') : c.pct >= 0.8 ? 'high' : c.pct >= 0.6 ? 'good' : c.pct >= 0.4 ? 'mid' : 'low'; }
function cellText(c) { return c.pct == null ? (c.status === 'dang' ? 'Đang làm' : 'Chưa làm') : pct(c.pct); }
function render(d) {
  var h = '';
  if (!d.cls) {
    h = '<h1 class="title">Chọn lớp</h1><div class="cards" style="margin-top:20px">' + d.classes.map(function (c, i) {
      return '<article class="card"><h2>' + esc(c.cls) + '</h2><p>' + c.students + ' em · ' + c.tests + ' bài đã giao</p><button class="btn primary" data-cls="' + i + '">Xem lớp</button><a href="' + esc(c.link) + '" target="_blank" rel="noopener">' + esc(c.link) + '</a><button class="btn ghost small" data-copy-class="' + i + '">Copy link lớp</button></article>';
    }).join('') + '</div>';
    if (!d.classes.length) h += '<p>Cô chưa có lớp nào. Thêm danh sách em vào trang Lớp trong Sheet nhé.</p>';
    $('content').innerHTML = h; return;
  }
  var last = d.tests.length ? d.tests[d.tests.length - 1] : null;
  h = '<div class="card"><h1 class="title">' + esc(d.cls) + '</h1><a href="' + esc(d.link) + '" target="_blank" rel="noopener">' + esc(d.link) + '</a><button class="btn ghost small" data-copy-link>Copy link lớp</button></div>';
  h += '<div class="stats" style="margin:22px 0">' + [[d.students.length, 'em'], [d.tests.length, 'bài đã giao'], [last ? pct(last.avg) : '—', 'điểm TB vòng 1 bài gần nhất'], [last ? d.students.length - last.done : '—', 'em chưa làm bài gần nhất']].map(function (x) { return '<div class="stat"><b>' + x[0] + '</b><span>' + x[1] + '</span></div>'; }).join('') + '</div><div class="section-list">';
  if (!d.tests.length) { $('content').innerHTML = h + section('Bài của lớp', '<p>Lớp chưa có bài nào. Gửi bài đọc cho Claude để giao bài.</p>') + '</div>'; return; }
  h += section('Điểm trung bình lớp qua các bài', chart(d.tests, 'avg', 'avgFinal'));
  var table = '<p class="note">Điểm vòng 1. Bấm tên em để xem chi tiết. Cô vuốt ngang trong bảng để xem đủ bài.</p><div class="table-scroll" tabindex="0" role="region" aria-label="Bảng điểm, có thể cuộn ngang"><table><thead><tr><th scope="col">Tên em</th>' + d.tests.map(function (t) { return '<th scope="col">' + esc(t.title) + '</th>'; }).join('') + '<th scope="col">TB của em</th></tr></thead><tbody>';
  d.students.forEach(function (name, i) {
    table += '<tr><th scope="row"><button class="link" data-student="' + i + '">' + esc(name) + '</button></th>';
    d.tests.forEach(function (t) { var c = d.grid[name][t.g]; table += '<td class="' + scoreClass(c) + '">' + cellText(c) + (c.finalPct != null ? '<br><small>Sau sửa ' + pct(c.finalPct) + '</small>' : '') + (c.flags.length ? '<br><small>' + esc(c.flags.join(' · ')) + '</small>' : '') + '</td>'; });
    table += '<td>' + pct(d.studentAvg[name]) + '</td></tr>';
  });
  h += section('Bảng điểm', table + '</tbody></table></div><p class="note">Màu điểm: ≥80% xanh đậm · 60–79% xanh nhạt · 40–59% vàng · &lt;40% đỏ nhạt. Viền chấm: đang làm.</p>');
  var max = d.errors.reduce(function (v, e) { return Math.max(v, e.count); }, 1);
  h += section('Lỗi lớp hay mắc', d.errors.length ? '<div class="section-list">' + d.errors.map(function (e) { return '<article><h3>' + esc(e.label) + ' · ' + e.count + ' lần</h3><div class="error-bar"><span style="width:' + (100 * e.count / max) + '%"></span></div><p>Mẹo: ' + esc(e.tip) + '</p><p class="note">Các em: ' + esc(e.students.join(', ')) + '</p></article>'; }).join('') + '</div>' : '<p>Chưa ghi nhận lỗi vòng 1.</p>');
  h += section('Câu nên chữa trên lớp', d.needFix.length ? '<div class="section-list">' + d.tests.map(function (t) { var qs = d.needFix.filter(function (q) { return q.g === t.g; }); return qs.length ? '<article><h3>' + esc(t.title) + '</h3>' + qs.map(function (q) { return '<p>Câu ' + esc(q.q) + ': ' + pct(q.wrongPct) + ' sai vòng 1 · ' + (q.fixPct == null ? 'chưa có lượt sửa' : pct(q.fixPct) + ' sửa được') + '</p>'; }).join('') + '</article>' : ''; }).join('') + '</div>' : '<p>Chưa có câu cần chữa theo ngưỡng đã đặt.</p>');
  var missing = d.notDone.filter(function (t) { return t.names.length; });
  h += section('Em chưa làm', missing.length ? '<div class="section-list">' + d.notDone.map(function (t, i) { return t.names.length ? '<article><h3>' + esc(t.title) + '</h3><p>' + esc(t.names.join(', ')) + '</p><button class="btn ghost small" data-copy-names="' + i + '">Copy danh sách tên</button></article>' : ''; }).join('') + '</div>' : '<p>Các em đều đã nộp vòng 1 các bài.</p>');
  $('content').innerHTML = h + '</div>';
}
function showStudent(i) {
  var d = D.data, name = d.students[i];
  var tests = d.tests.map(function (t) { var c = d.grid[name][t.g]; return { title: t.title, avg: c.pct, avgFinal: c.finalPct, cell: c, mode: t.mode, due: t.due }; });
  var errors = d.errors.filter(function (e) { return e.students.indexOf(name) >= 0; });
  $('studentDetail').innerHTML = '<div class="row"><h2>' + esc(name) + '</h2><button class="link" id="closeStudent">Đóng chi tiết</button></div>' + chart(tests, 'avg', 'avgFinal') + '<h3>Các bài của em</h3>' + tests.map(function (t) { return '<article class="type"><b>' + esc(t.title) + '</b><p>' + esc(t.mode) + (t.due ? ' · Hạn: ' + esc(t.due) : '') + '</p><p>' + cellText(t.cell) + (t.avgFinal != null ? ' · Sau sửa ' + pct(t.avgFinal) : '') + '</p>' + (t.cell.flags.length ? '<p class="note">' + esc(t.cell.flags.join(' · ')) + '</p>' : '') + '</article>'; }).join('') + '<h3>Lỗi em cần chú ý</h3>' + (errors.length ? errors.map(function (e) { return '<article class="type"><b>' + esc(e.label) + '</b><p>Mẹo: ' + esc(e.tip) + '</p></article>'; }).join('') : '<p>Chưa ghi nhận lỗi vòng 1 của em.</p>');
  $('studentDetail').hidden = false; $('studentDetail').focus(); $('studentDetail').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function copyText(text) {
  function fallback() { $('copyFallback').hidden = false; $('copyText').value = text; $('copyText').focus(); $('copyText').select(); $('copyFallback').scrollIntoView({ block: 'center' }); }
  if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(text).then(function () { message('Đã copy. Cô có thể dán vào Zalo.'); }, fallback); } else fallback();
}
$('loginForm').addEventListener('submit', function (e) { e.preventDefault(); D.pass = $('passcode').value.trim(); fetchClass(recalled('reading-teacher-class'), true); });
$('logoutBtn').addEventListener('click', logout);
$('classesBtn').addEventListener('click', function () { fetchClass(''); });
$('reloadBtn').addEventListener('click', function () { fetchClass(D.cls); });
$('closeCopy').addEventListener('click', function () { $('copyFallback').hidden = true; });
$('studentDetail').addEventListener('click', function (e) { if (e.target.id === 'closeStudent') $('studentDetail').hidden = true; });
$('content').addEventListener('click', function (e) {
  var b = e.target.closest('button'); if (!b || D.busy) return;
  if (b.hasAttribute('data-cls')) fetchClass(D.data.classes[+b.getAttribute('data-cls')].cls);
  else if (b.hasAttribute('data-copy-class')) copyText(D.data.classes[+b.getAttribute('data-copy-class')].link);
  else if (b.hasAttribute('data-copy-link')) copyText(D.data.link);
  else if (b.hasAttribute('data-copy-names')) { var t = D.data.notDone[+b.getAttribute('data-copy-names')]; copyText(t.title + '\nCác em chưa làm:\n' + t.names.join('\n')); }
  else if (b.hasAttribute('data-student')) showStudent(+b.getAttribute('data-student'));
});
D.pass = recalled('reading-teacher-pass');
if (D.pass) fetchClass(recalled('reading-teacher-class'), true);
</script>
</body>
</html>
